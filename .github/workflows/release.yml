name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        df -h
        
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build plugin
      run: ./gradlew buildPlugin
      
    - name: Cleanup build cache
      run: |
        rm -rf build/idea-sandbox
        rm -rf build/tmp
        df -h
      
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        ls -la build/distributions/
        
    - name: Find plugin zip file
      id: find_zip
      run: |
        ZIP_FILE=$(find build/distributions/ -name "*.zip" | head -1)
        echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_OUTPUT
        echo "Found zip file: $ZIP_FILE"
        
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create ${{ github.ref_name }} \
          --title "Release ${{ github.ref_name }}" \
          --notes "Download the plugin zip file and install it in your IDE:

1. Open your IntelliJ IDEA or compatible IDE
2. Go to **Settings/Preferences** → **Plugins**
3. Click the **⚙️ (gear icon)** → **Install Plugin from Disk...**
4. Select the downloaded `.zip` file
5. Restart the IDE when prompted" \
          ${{ steps.find_zip.outputs.ZIP_FILE }}
